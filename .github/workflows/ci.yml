name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the 2- and 6-rank CPU tests"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff, ruff-format and the whitespace/YAML hooks, pinned in
      # .pre-commit-config.yaml. mypy is a local hook bound to ./.venv, so it
      # runs separately below against CPU torch.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: mypy
      - name: Install mypy
        run: |
          pip install mypy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps -e .
      - run: mypy --config-file pyproject.toml --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        # Tests are marked @pytest.mark.dist(N) and only run when the mpirun
        # rank count is exactly N, so each count needs its own job. CI covers
        # 1/4/8 ranks; the 2- and 6-rank tests run on a manual dispatch
        # (Actions -> CI -> Run workflow, "full"), 10/12/24 ranks and all GPU
        # tests on a dev machine or the cluster.
        # One Python only: the 3.11 floor in requires-python is guarded
        # statically by mypy (python_version = "3.11") in the lint job.
        ranks: [1, 4, 8]
    name: test (py${{ matrix.python-version }}, ${{ matrix.ranks }} ranks)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Install package (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          OMPI_MCA_hwloc_base_binding_policy: none
        run: mpirun -n ${{ matrix.ranks }} pytest tests --device cpu

  # Remaining hosted-runner rank counts (non-power-of-two meshes etc.); only on
  # a manual dispatch with "full" ticked, to keep PR CI cheap.
  test-full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ranks: [2, 6]
    name: test (py3.12, ${{ matrix.ranks }} ranks)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      # The venv (CPU torch + dev deps) is shared by every rank-count job and
      # only rebuilt when pyproject.toml, the Python patch version or the runner
      # image changes. ImageOS is in the key because mpi4py links the apt OpenMPI.
      - uses: actions/cache@v4
        id: venv
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ env.ImageOS }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Build venv (CPU torch)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          ~/venv/bin/pip install ".[dev]"
      - name: Install package
        run: |
          ~/venv/bin/pip install --no-deps -e .
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - name: Tests
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          OMPI_MCA_hwloc_base_binding_policy: none
        run: mpirun -n ${{ matrix.ranks }} pytest tests --device cpu

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Check wheel contents
        run: |
          unzip -l dist/*.whl | grep -E "jigsaw/modules/linear/|py.typed"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
