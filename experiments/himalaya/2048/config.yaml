data:
  train_data_path: "data_processed/2048/train"
  valid_data_path: "data_processed/2048/val"
  base_dir: "data_processed"
  image_dir: "data/images/images/"
  mask_dir: "data/masks/masks/"
  image_height: 2048
  image_width: 2048
  in_channels: 1
  num_classes: 2
  num_workers: 4
  train_subset: -1
  valid_subset: -1

training:
  lr: 0.0001
  loss: TopK_Dice
  top_k: 50
  train_batch: 8
  valid_batch: 8
  epochs: 35
  grad_clip: 0.5
  save_dir: "results_2048_mlpmixer"

model:
  mlp_ratio: 4.0
  kernel_flex: true
  seed: 42
  save_model: true
  checkpoint_file: "results_2048_mlpmixer/best_model_mlpmixer.pth"

model_parallel:
  parallelism: 4 

