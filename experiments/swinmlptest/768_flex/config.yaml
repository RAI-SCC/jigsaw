data:
  test_data_path: "data_processed/768/test"
  image_height: 768
  image_width: 768
  in_channels: 1 
  num_classes: 2
  num_workers: 4
  xlat: 720
  xlon: 1440

training:
  valid_batch: 8

SWIN_MLP:
  window_size: 4       
  patch_size: 4        
  architecture: "swin"
  dropout: 0.2
  mlp_ratio: 4.0
  shifted_windows: true
  kernel_flex: true
  seed: 42
  checkpoint_file: "test_models/swinmlp/768_flex/best_model.pth"

testing:
  output_dir: "test_results/swinmlp/768_flex"
  n_visual_samples: 6
  threshold: 0.5
  seed: 42