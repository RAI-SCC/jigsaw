data:
  dt: 6
  train_data_path: "data_processed/256/train"
  valid_data_path: "data_processed/256/val"
  #base_dir: "data_processed_seed83"
  base_dir: "data_processed"
  image_dir: "data/images/images/"
  mask_dir: "data/masks/masks/"
  image_height: 256
  image_width: 256
  in_channels: 1
  num_classes: 2
  preprocessed: false
  constant_masks_path: /hkfs/work/workspace/scratch/ke4365-jigsaw/Jigsaw/constant_masks
  train_subset: -1
  valid_subset: -1
  prefetch_factor: 2
  num_workers: 4
  xlat: 720
  xlon: 1440
  lite: false
  resolution: 0.25
model:
  hidden_dim: 896
  spatial_hidden_dim_fraction: 0.125
  features_hidden_dim_fraction: 1
  mixing_blocks: 3
  model_parallel: false
  patch_size: 60
  stride: 60
  add: false
  patch_embed: 1
  latent_rollout: 1
  concat: true
  linear_residual: true
  dropout: 0.001
training:
  lr: 0.001
  lr_embedding: 2.0e-05
  lr_recovery: 2.0e-05
  #loss: CE_TopK_Dice
  loss: CE_Dice
  lr_constant: false
  train_batch: 8
  valid_batch: 8
  epochs: 35
  identity: false
  grad_clip: 1
  save_dir: results_256
  preload: false
  file_path: .
  load_path: .
  area_weighted: true
  print: false
  tf32: true
model_parallel:
  parallelism: 1
SWIN_MLP:
  window_size: 4
  patch_size: 4
  architecture: "swin"
  dropout: 0.2
  mlp_ratio: 4.0
  shifted_windows: true
  kernel_flex: false
  seed: 42
  save_model: true
  checkpoint_file: "results_256/best_model_fix.pth"
