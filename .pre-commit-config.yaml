default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_language_version:
  python: python3.12
repos:
  - repo: local
    hooks:
    - id: pytest
      name: pytest
      entry: ./.venv/bin/pytest tests
      language: system
      types: [python]
      pass_filenames: false
      always_run: true
      stages: [pre-push]
    - id: mypy
      name: mypy
      entry: ./.venv/bin/mypy --config-file pyproject.toml --ignore-missing-imports
      language: system
      types: [python]
      pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.12
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  # Conventional Commits on the commit message (rules in .commitlintrc.yaml).
  # pre-commit bootstraps its own node, so no system node is needed.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.2"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      # assuming
