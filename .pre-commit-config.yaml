default_language_version:
  python: python3.12
repos:
  - repo: local
    hooks:
    - id: pytest
      name: pytest
      # Distributed tests need a multi-rank launcher (tests/run_distributed_tests.sh)
      # and are excluded here by filename convention, as in torch-harmonics.
      entry: ./.venv/bin/pytest tests --ignore-glob="**/test_distributed_*"
      language: system
      types: [python]
      pass_filenames: false
      always_run: true
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0 # Use the sha / tag you want to point at
    hooks:
      - id: mypy
        args: [--config-file, pyproject.toml, --ignore-missing-imports]
        additional_dependencies:
          - torch
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.12
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      # assuming
