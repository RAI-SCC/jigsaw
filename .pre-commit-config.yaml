default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_language_version:
  python: python3.12
repos:
  - repo: local
    hooks:
    - id: pytest
      name: pytest
      entry: ./.venv/bin/pytest tests
      language: system
      types: [python]
      pass_filenames: false
      always_run: true
      stages: [pre-push]
    - id: mypy
      name: mypy
      # Own cache dir: the VS Code mypy extension (a different mypy version) writes
      # .mypy_cache and invalidates it, forcing a full re-check of torch every commit.
      entry: ./.venv/bin/mypy --config-file pyproject.toml --ignore-missing-imports --cache-dir .mypy_cache_precommit
      language: system
      # toml too, so a change to the [tool.mypy] config in pyproject.toml re-checks.
      types_or: [python, toml]
      pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.12
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  # TorchFix: removed, deprecated or unsafe torch APIs (torch.load without
  # weights_only, checkpoint without use_reentrant, private torch._* calls, ...).
  # A flake8 plugin, so ruff cannot run it.
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        name: torchfix
        args: [--isolated, --select=TOR]
        additional_dependencies: [torchfix==0.7.0]
  # Docstrings against numpydoc; configured in pyproject.toml.
  - repo: https://github.com/numpy/numpydoc
    rev: v1.11.0
    hooks:
      - id: numpydoc-validation
        files: ^jigsaw/
  # Abbreviations used in the code (te, dout, ...) are allowlisted in pyproject.toml.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
  # pyproject.toml packaging metadata against its schema (check-toml only checks syntax).
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject
  # Workflow files against the GitHub Actions schema.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
  # Conventional Commits on the commit message (rules in .commitlintrc.yaml).
  # pre-commit bootstraps its own node, so no system node is needed.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.2"]
  - repo: https://github.com/citation-file-format/cffconvert
    # No stable release for the pre-commit hook here, so commit pinned
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      # Validate CITATION.cff against the Citation File Format schema.
      - id: validate-cff
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # pyproject.toml carries the ruff, mypy and pytest config.
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      # A stray breakpoint() hangs every rank under mpirun instead of failing.
      - id: debug-statements
