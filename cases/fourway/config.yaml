data:
  dt: 6
  train_data_path: '/data/era5.zarr'
  valid_data_path: '/data/era5.zarr'
  train_subset: -1
  valid_subset: -1
  prefetch_factor: 2 
  num_workers: 20
  xlat: 720
  xlon: 1440
  lite: False
model:
  hidden_dim: 4320
  spatial_hidden_dim_fraction: 0.5
  features_hidden_dim_fraction: 1
  mixing_blocks: 3
  model_parallel: True
  patch_size: 60
  stride: 60
  add: False
  patch_embed: 1
  latent_rollout: 1
  concat: True
  linear_residual: True
  dropout: 0.001
training:
  lr: 0.0001
  lr_embedding: 0.00002
  lr_recovery: 0.00002
  loss: 'L2'
  lr_constant: False
  train_batch: 1
  valid_batch: 1
  identity: False
  grad_clip: 1
  save_dir: '.'
  preload: False
  file_path: '.'
  load_path: '.'
  area_weighted: True
  print: False
  tf32: True
model_parallel:
  parallelism: 4
