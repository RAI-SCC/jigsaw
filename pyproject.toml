[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "jigsaw"
]

[project]
name = "jigsaw"
version = "0.0.1"
authors = [
  { name="Deifilia Kieckhefen", email="deifilia.kieckhefen@kit.edu"},
]
description = "The Jigsaw model parallelization scheme"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "torch",
    "zarr",
    "timm",
    "pyyaml",
    "xarray",
    "matplotlib",
    "einops",
    "gcsfs"
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest",
    "coverage",
    "pytest-cov",
    "mpi4py>=4.1.1",
    "hypothesis>=6.1.1",

    # QA
    "pre-commit",
    "ruff",
    "mypy",

]
scripts = []

# Mypy
[tool.mypy]
python_version="3.12"
packages=["jigsaw"]
exclude=[
    'tests/',
    'beast/model/test_models/',
]

disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs=true
warn_return_any=true
show_error_codes =true
warn_unused_ignores=false
follow_imports = "normal"
follow_untyped_imports = true

# Ruff
[tool.ruff]
target-version = "py312"
exclude = ["docs", "examples""]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "D417", "N"]
ignore = ["E501", "NPY201"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

# Testing
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["jigsaw"]
command_line = "-m pytest"

[tool.coverage.report]
format = "markdown"