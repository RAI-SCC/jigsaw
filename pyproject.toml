[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jigsaw*"]

[tool.setuptools.package-data]
jigsaw = ["py.typed"]

[project]
name = "torch-jigsaw"
version = "0.0.1"
authors = [
  { name="Deifilia Kieckhefen", email="deifilia.to@gmail.com"},
]
description = "The Jigsaw domain- and tensor-parallelization scheme"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
]
# The library itself only imports torch and einops. numpy is never imported
# directly, but torch does not pull it in and needs it for
# `dist.all_gather_object` (used by `jigsaw.log`). transformer-engine is an
# optional, environment-provided accelerator (see containers/README.md) and is
# never a pip dependency. Bare-metal install: `pip install -e .`; container
# install: `pip install --no-deps -e .` on top of the image's torch.
dependencies = [
    "torch>=2.6",
    "einops>=0.6",
    "numpy",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest",
    "coverage",
    "pytest-cov",
    "mpi4py>=4.1.1",

    # QA
    "pre-commit",
    "ruff",
    "mypy",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "numpy",
]

# Mypy
[tool.mypy]
python_version="3.11"
packages=["jigsaw"]
exclude=[
    'tests/',
    '^scaling_scripts/',
    'stash/'
]

disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs=true
warn_return_any=true
show_error_codes =true
warn_unused_ignores=false
warn_redundant_casts=true
follow_imports = "normal"
follow_untyped_imports = true

# numpy (and scipy, when installed) are only reached through torch. Their stubs use
# syntax newer than the `python_version` checked against above, which stops mypy
# before it gets to jigsaw.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "scipy", "scipy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# CI installs CPU torch (no triton), so triton resolves to Any there. Skip it locally
# too: mypy can't type `kernel[grid](..., num_warps=...)` launches or constexpr params.
[[tool.mypy.overrides]]
module = ["triton", "triton.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# The TE/flash-attn cores import these behind try/except; they exist only in the GPU
# container. Only silences the "not found" error, so where installed they are still
# followed and checked.
[[tool.mypy.overrides]]
module = [
    "transformer_engine",
    "transformer_engine.*",
    "transformer_engine_torch",
    "flash_attn",
    "flash_attn.*",
]
ignore_missing_imports = true

# Ruff
[tool.ruff]
target-version = "py311"
exclude = ["docs", "examples", "scaling_scripts", "stash"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "D417", "N", "ARG001", "B", "RUF100", "ISC", "PIE", "PERF", "UP"]
ignore = ["E501", "NPY201", "N812"]

[tool.ruff.lint.per-file-ignores]
# ARG001: pytest fixtures requested only for their side effects.
"tests/*" = ["D", "F403", "ARG001"]
# Triton kernels: UPPERCASE params are the ecosystem convention for
# `tl.constexpr` / shape arguments.
"jigsaw/modules/attention/_functional/_merge_kernel.py" = ["N803"]

# torch.device is immutable, so it is safe as a default argument value.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["torch.device"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

# Spelling
[tool.codespell]
# te: TransformerEngine; dout: output gradient; nd: N-d; fo: fan-out.
ignore-words-list = "te,dout,nd,fo"

# Docstrings - numpydoc's own validator (also run via pre-commit)
[tool.numpydoc_validation]
checks = [
    "all",
    "ES01",  # an extended summary is optional
    "EX01",  # an Examples section is optional
    "SA01",  # a See Also section is optional
]
# Public API only. Constructors are documented in the class docstring, as numpydoc
# prescribes. Private names (and so every autograd Function, all ``_``-named) are left
# to ruff's D rules: their ctx / grad_* arguments are conventional.
exclude = ['\.__init__$', '\._[^_]']

# Testing
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["jigsaw"]
command_line = "-m pytest"

[tool.coverage.report]
format = "markdown"
