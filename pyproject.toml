[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "jigsaw"
]

[project]
name = "jigsaw"
version = "0.0.1"
authors = [
  { name="Deifilia Kieckhefen", email="deifilia.to@gmail.com"},
]
description = "The Jigsaw domain- and tensor-parallelization scheme"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
]
# Bare-metal install: `pip install -e .` pulls everything below.
# Container install: the NGC image already ships torch (+ transformer-engine,
# not listed here - it is environment-provided, never a pip dep). Install with
# `pip install --no-deps -e .` plus the pure-Python extras, see
# containers/README.md.
dependencies = [
    "torch",
    "zarr",
    "timm",
    "pyyaml",
    "xarray",
    "matplotlib",
    "einops"
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest",
    "coverage",
    "pytest-cov",
    "mpi4py>=4.1.1",
    "hypothesis>=6.1.1",

    # QA
    "pre-commit",
    "ruff",
    "mypy",

]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "numpy",
]
scripts = []

# Mypy
[tool.mypy]
python_version="3.11"
packages=["jigsaw"]
exclude=[
    'tests/',
    '^scaling_scripts/',
    'stash/'
]

disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs=true
warn_return_any=true
show_error_codes =true
warn_unused_ignores=false
follow_imports = "normal"
follow_untyped_imports = true

# Ruff
[tool.ruff]
target-version = "py312"
exclude = ["docs", "examples", "scaling_scripts", "stash"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "D417", "N"]
ignore = ["E501", "NPY201", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "F403"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

# Testing
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["jigsaw"]
command_line = "-m pytest"

[tool.coverage.report]
format = "markdown"
