[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jigsaw*"]

[tool.setuptools.package-data]
jigsaw = ["py.typed"]

[project]
name = "torch-jigsaw"
version = "0.0.1"
authors = [
  { name="Deifilia Kieckhefen", email="deifilia.to@gmail.com"},
]
description = "The Jigsaw domain- and tensor-parallelization scheme"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
]
# The library itself only imports torch and einops. numpy is never imported
# directly, but torch does not pull it in and needs it for
# `dist.all_gather_object` (used by `jigsaw.log`). transformer-engine is an
# optional, environment-provided accelerator (see containers/README.md) and is
# never a pip dependency. Bare-metal install: `pip install -e .`; container
# install: `pip install --no-deps -e .` on top of the image's torch.
dependencies = [
    "torch>=2.6",
    "einops>=0.6",
    "numpy",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest",
    "coverage",
    "pytest-cov",
    "mpi4py>=4.1.1",

    # QA
    "pre-commit",
    "ruff",
    "mypy",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "numpy",
]

# Mypy
[tool.mypy]
python_version="3.11"
packages=["jigsaw"]
exclude=[
    'tests/',
    '^scaling_scripts/',
    'stash/'
]

disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs=true
warn_return_any=true
show_error_codes =true
warn_unused_ignores=false
follow_imports = "normal"
follow_untyped_imports = true

# numpy is only reached through torch. Its stubs use syntax newer than the
# `python_version` checked against above, which stops mypy before it gets to jigsaw.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# Ruff
[tool.ruff]
target-version = "py312"
exclude = ["docs", "examples", "scaling_scripts", "stash"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "D417", "N"]
ignore = ["E501", "NPY201", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "F403"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

# Testing
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["jigsaw"]
command_line = "-m pytest"

[tool.coverage.report]
format = "markdown"
