version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      # Install jigsaw itself with no runtime deps - torch/transformer_engine
      # etc. are mocked in docs/conf.py so autodoc never needs them installed.
      - pip install --no-deps -e .
      - pip install -r docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
